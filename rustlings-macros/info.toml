# VARIABLES

[[exercises]]
name = "variables1"
dir = "01_variables"
test = false
hint = """
The declaration in the `main` function is missing a keyword that is needed
in Rust to create a new variable binding."""

[[exercises]]
name = "variables2"
dir = "01_variables"
test = false
hint = """
The compiler message is saying that Rust can't infer the type that the
variable binding `x` has with what is given here.

What happens if you annotate the first line in the `main` function with a type
annotation?

What if you give `x` a value?

What if you do both?

What type should `x` be, anyway?

What if `x` is the same type as `10`? What if it's a different type?"""

[[exercises]]
name = "variables3"
dir = "01_variables"
test = false
hint = """
In this exercise, we have a variable binding that we've created in the `main`
function, and we're trying to use it in the next line, but we haven't given it
a value.

We can't print out something that isn't there; try giving `x` a value!

This is an error that can cause bugs that's very easy to make in any
programming language -- thankfully the Rust compiler has caught this for us!"""

[[exercises]]
name = "variables4"
dir = "01_variables"
test = false
hint = """
In Rust, variable bindings are immutable by default. But here, we're trying
to reassign a different value to `x`! There's a keyword we can use to make
a variable binding mutable instead."""

[[exercises]]
name = "variables5"
dir = "01_variables"
test = false
hint = """
In `variables4` we already learned how to make an immutable variable mutable
using a special keyword. Unfortunately this doesn't help us much in this
exercise because we want to assign a different typed value to an existing
variable. Sometimes you may also like to reuse existing variable names because
you are just converting values to different types like in this exercise.

Fortunately Rust has a powerful solution to this problem: 'Shadowing'!
You can read more about 'Shadowing' in the book's section 'Variables and
Mutability':
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing

Try to solve this exercise afterwards using this technique."""

[[exercises]]
name = "variables6"
dir = "01_variables"
test = false
hint = """
We know about variables and mutability, but there is another important type of
variable available: constants.

Constants are always immutable. They are declared with the keyword `const`
instead of `let`.

The type of Constants must always be annotated.

Read more about constants and the differences between variables and constants
under 'Constants' in the book's section 'Variables and Mutability':
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#constants"""

[[exercises]]
name = "variables7"
dir = "01_variables"
test = false
hint = """
Compound assignment operators like `+=` and `*=` change the value stored in
a variable. That's only allowed if the variable was declared as mutable."""

[[exercises]]
name = "variables8"
dir = "01_variables"
test = false
hint = """
Making `x` mutable fixes the compiler error, but then the second assertion
fails because the outer `x` was changed.

Instead, create a *new* variable `x` inside the block with `let`. It shadows
the outer `x` only until the end of the block (`}`).
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing"""

[[exercises]]
name = "variables9"
dir = "01_variables"
test = false
hint = """
A variable only lives inside the block `{ ... }` where it was declared.
When the block ends, the variable goes out of scope.

Declare `greeting` *before* the inner block so that it is visible in both
places."""

[[exercises]]
name = "variables10"
dir = "01_variables"
test = false
hint = """
In Rust, a block `{ ... }` is an expression. Its value is the value of its
last expression, as long as that expression is *not* followed by a semicolon.

`double_width + double_height;` is a statement, so the block evaluates to the unit type `()`."""

[[exercises]]
name = "variables11"
dir = "01_variables"
test = false
hint = """
You can declare a variable without a value and assign it later, *exactly once*,
without making it mutable. The compiler checks that it is initialized before
it is used.

Assign `total = a + b;` inside the block, after `a` and `b` are declared."""

[[exercises]]
name = "variables12"
dir = "01_variables"
test = false
hint = """
The method `parse` can turn a string into many different types (`i32`, `u8`,
`f64`, …). The compiler can't guess which one you want, so you need to tell it
with a type annotation:

```
let x: SomeType = ...;
```"""

[[exercises]]
name = "variables13"
dir = "01_variables"
test = false
hint = """
When destructuring a tuple with `let (a, b) = ...;`, each name in the pattern
is its own variable. To make one of them mutable, put `mut` in front of that
name inside the pattern: `let (mut a, b) = ...;`"""

# FUNCTIONS

[[exercises]]
name = "functions1"
dir = "02_functions"
test = false
hint = """
This `main` function is calling a function that it expects to exist, but the
function doesn't exist. It expects this function to have the name `call_me`.
It also expects this function to not take any arguments and not return a value.
Sounds a lot like `main`, doesn't it?"""

[[exercises]]
name = "functions2"
dir = "02_functions"
test = false
hint = """
Rust requires that all parts of a function's signature have type annotations,
but `call_me` is missing the type annotation of `num`."""

[[exercises]]
name = "functions3"
dir = "02_functions"
test = false
hint = """
This time, the function *declaration* is okay, but there's something wrong
with the place where we are calling the function."""

[[exercises]]
name = "functions4"
dir = "02_functions"
test = false
hint = """
The error message points to the function `sale_price` and says it expects a type
after `->`. This is where the function's return type should be.
Take a look at the `is_even` function for an example!"""

[[exercises]]
name = "functions5"
dir = "02_functions"
test = false
hint = """
This is a really common error that can be fixed by removing one character.
It happens because Rust distinguishes between expressions and statements:
Expressions return a value based on their operand(s), and statements simply
return a `()` type which behaves just like `void` in C/C++.

We want to return a value with the type `i32` from the `square` function, but
it is returning the type `()`.

There are two solutions:
1. Add the `return` keyword before `num * num;`
2. Remove the semicolon `;` after `num * num`"""

# CONSTANTS AND STATICS

[[exercises]]
name = "constants1"
dir = "02b_const_static"
test = false
hint = """
The value of a constant has to be known at compile time. A `let` variable
only exists while the program is running, so it can't be used to compute a
constant.

Turn `minutes_per_hour` into a constant too (constants are written in
`SCREAMING_SNAKE_CASE` and need a type annotation)."""

[[exercises]]
name = "constants2"
dir = "02b_const_static"
test = false
hint = """
Constant expressions are evaluated by the compiler. If the computation
overflows, you get a compile-time error instead of a bug at runtime!

The maximum value of a `u32` is about 4.29 billion. A light year is a lot more
meters than that. Which integer type is big enough?"""

[[exercises]]
name = "constants3"
dir = "02b_const_static"
test = false
hint = """
The length of an array is part of its type, so it must be known at compile
time. A `let` variable won't do, but a `const` will!

Array lengths have the type `usize`."""

[[exercises]]
name = "constants4"
dir = "02b_const_static"
test = false
hint = """
Normal functions can't be called when computing a constant because they are
run at runtime. If you mark a function as `const fn`, the compiler is allowed
to run it at compile time.
https://doc.rust-lang.org/reference/const_eval.html#const-functions"""

[[exercises]]
name = "constants5"
dir = "02b_const_static"
test = false
hint = """
A constant declared inside a function is only visible inside that function.
Constants declared at the top level of a file (outside of any function) are
visible everywhere in that file (the module)."""

[[exercises]]
name = "statics1"
dir = "02b_const_static"
test = false
hint = """
Statics are declared like constants, but with the `static` keyword:

```
static NAME: Type = value;
```

Like constants, they need an explicit type. String literals have the type
`&str` (or more precisely `&'static str`)."""

[[exercises]]
name = "statics2"
dir = "02b_const_static"
hint = """
The compiler needs to know how long a returned reference is valid. Since
the function takes no references as arguments, it can't figure that out
itself.

Data in a `static` lives for the whole duration of the program. This is
written as the `'static` lifetime: `&'static str`."""

[[exercises]]
name = "statics3"
dir = "02b_const_static"
test = false
hint = """
Just like constants, statics are initialized at compile time. `String::from`
allocates memory on the heap while the program is running, so it can't be used
to initialize a static.

A string literal (`&str`) is stored directly in the compiled program, so it's
perfect for a static. Remember that `&str` can be compared with `==` to a
`String` and vice versa.

Note: `String::new()` would actually work because it is a `const fn` that
doesn't allocate anything, but then the string would be empty."""

[[exercises]]
name = "statics4"
dir = "02b_const_static"
test = false
hint = """
Statics are immutable, so `VISITS += 1` wouldn't compile. A `static mut`
would require `unsafe` code, which you should avoid (and which is forbidden in
Rustlings).

Atomic types like `AtomicU32` can be changed through a shared (immutable)
reference, so they can be stored in a normal (non-`mut`) static without any
`unsafe`.

Look at the method `fetch_add` in the documentation:
https://doc.rust-lang.org/std/sync/atomic/type.AtomicU32.html#method.fetch_add

Don't worry about `Ordering` for now. `Ordering::Relaxed` is fine here."""

[[exercises]]
name = "statics5"
dir = "02b_const_static"
test = false
hint = """
A `const` doesn't have a fixed memory location. Every time you use it, the
compiler inserts a *fresh copy* of its value. So each `CALLS.fetch_add(…)`
increments a brand new temporary counter that is thrown away immediately.

A `static` on the other hand has exactly one location in memory for the whole
program. Change one keyword to fix the program."""

# IF

[[exercises]]
name = "if1"
dir = "03_if"
hint = """
It's possible to do this in one line if you would like!

Some similar examples from other languages:
- In C(++) this would be: `a > b ? a : b`
- In Python this would be:  `a if a > b else b`

Remember in Rust that:
- The `if` condition does not need to be surrounded by parentheses
- `if`/`else` conditionals are expressions
- Each condition is followed by a `{}` block"""

[[exercises]]
name = "if2"
dir = "03_if"
hint = """
For that first compiler error, it's important in Rust that each conditional
block returns the same type!

To get the tests passing, you will need a couple conditions checking different
input values. Read the tests to find out what they expect."""

[[exercises]]
name = "if3"
dir = "03_if"
hint = """
In Rust, every arm of an `if` expression has to return the same type of value.
Make sure the type is consistent across all arms."""

[[exercises]]
name = "if4"
dir = "03_if"
hint = """
When `if` is used as an expression (here as the return value of the
function), every possible path must produce a value. An `if` without a final
`else` produces `()` when no condition matches.

Look at the tests to see what should be returned for `0`."""

[[exercises]]
name = "if5"
dir = "03_if"
hint = """
Unlike C, JavaScript or Python, Rust has no "truthy" or "falsy" values.
The condition of an `if` must be of type `bool`. Use a comparison operator
like `==`, `!=`, `>` to turn the number into a `bool`."""

[[exercises]]
name = "if6"
dir = "03_if"
hint = """
You can combine conditions with the logical operators:
- `&&` (and)
- `||` (or)
- `!` (not)

A year is a leap year if
`(divisible by 4 AND NOT divisible by 100) OR divisible by 400`.
"Divisible by 4" can be written as `year % 4 == 0` or `year.is_multiple_of(4)`."""

[[exercises]]
name = "if7"
dir = "03_if"
hint = """
The conditions of an `if`/`else if` chain are checked from top to bottom, and
only the *first* matching branch runs. A score of 95 is `>= 60`, so it gets a
'D' before the other conditions are even looked at.

Reorder the branches so that the most specific condition comes first."""

[[exercises]]
name = "if8"
dir = "03_if"
hint = """
First check whether the triangle is valid at all:
- No side can be 0.
- The sum of any two sides must be greater than the third side
  (`a + b > c`, `a + c > b` and `b + c > a`).

You can use `return "invalid";` to return early from the function, or put
the check as the first branch of the `if`/`else if` chain."""

